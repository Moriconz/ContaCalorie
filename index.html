<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Monitora calorie, proteine e macro ogni giorno con una PWA mobile-first." />
  <meta name="theme-color" content="#6366f1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f0f1e" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Conta Calorie" />
  <title>Conta Calorie</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  
  <!-- Theme & Glassmorphism CSS -->
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/glassmorphism.css" />
  <link rel="stylesheet" href="css/background.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Design system: componenti riutilizzabili -->
  <link rel="stylesheet" href="css/components.css" />
  <!-- Mobile-Optimized 2026 Best Practices -->
  <link rel="stylesheet" href="css/mobile-optimized-2026.css" />
  
  <link rel="icon" href="icons/icon-192.svg" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  
  <script>
    // Applica il tema PRIMA del primo paint (niente flash).
    // Default = tema di sistema; la scelta esplicita salvata ha la precedenza.
    const savedTheme = localStorage.getItem('theme')
      || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', savedTheme);

    // In produzione silenzia i log di debug (warn/error restano attivi).
    // Per riattivarli: aggiungi ?debug=1 all'URL.
    (function () {
      const isDev = ['localhost', '127.0.0.1'].includes(location.hostname);
      const debugForced = new URLSearchParams(location.search).has('debug');
      if (!isDev && !debugForced) {
        const noop = () => {};
        console.log = noop;
        console.debug = noop;
        console.info = noop;
      }
    })();
  </script>
  <script>
    // NOTA: la registrazione del service worker avviene UNA SOLA VOLTA in
    // js/appBootstrap.js (prima era duplicata anche qui → doppi listener update).

    // Cattura beforeinstallprompt IL PIÙ PRESTO POSSIBILE
    window.__beforeInstallPromptEvent = null;
    window.__beforeInstallPromptCaught = false;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.__beforeInstallPromptEvent = e;
      window.__beforeInstallPromptCaught = true;
    }, true);
  </script>
</head>
<body>
  <!-- Animated background container with blobs -->
  <div class="bg-container">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <!-- Modal Template -->
  <template id="modalTemplate">
    <div class="modal-overlay">
      <div class="modal-card">
        <button class="modal-close" type="button" aria-label="Chiudi modale">✕</button>
        <div class="modal-body"></div>
      </div>
    </div>
  </template>

  <!-- Content wrapper -->
  <div class="content-wrapper">
    <div id="app" class="app-shell">
      <header class="topbar navbar">
        <div class="brand">Conta Calorie</div>
        <div class="topbar-actions">
          <button id="installAppBtn" class="install-topbar-btn" aria-label="Aggiungi alla schermata home" title="Aggiungi alla schermata home">
            📲
          </button>
          <button id="themeToggle" class="icon-button" aria-label="Cambia tema">☀️</button>
        </div>
      </header>

      <main id="mainContent" class="page-content"></main>

      <nav id="bottomNav" class="bottom-nav" aria-label="Navigazione principale"></nav>
    </div>
  </div>

  <!-- App scripts -->
  <script type="module">
    console.log('📱 Script module è INIZIATO');

    import { themeManager } from './js/themeManager.js';
    import { init as initApp } from './js/app.js';

    console.log('✅ Import completati, avvio app...');

    // Inizializza tema manager
    console.log('🎨 ThemeManager inizializzato');

    // Setup theme toggle button
    const themeToggle = document.getElementById('themeToggle');
    if (themeToggle) {
      themeToggle.addEventListener('click', () => {
        const newTheme = themeManager.toggleTheme();
        updateThemeIcon(newTheme);
      });
      updateThemeIcon(themeManager.getTheme());
    }

    function updateThemeIcon(theme) {
      if (themeToggle) {
        themeToggle.textContent = theme === 'dark' ? '🌙' : '☀️';
      }
      // Sincronizza la status bar del telefono col tema scelto manualmente
      // (i meta con media query seguono il tema di sistema, non quello dell'app)
      const color = theme === 'dark' ? '#0f0f1e' : '#6366f1';
      document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.setAttribute('content', color));
    }
    updateThemeIcon(themeManager.getTheme());

    // Listen for theme changes
    window.addEventListener('themechange', (e) => {
      updateThemeIcon(e.detail.theme);
    });

    // Inizializza app
    await initApp();
  </script>
</body>
</html>
