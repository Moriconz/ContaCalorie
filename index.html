<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Monitora calorie, proteine e macro ogni giorno con una PWA mobile-first." />
  <meta name="theme-color" content="#6366f1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f0f1e" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Conta Calorie" />
  <title>Conta Calorie</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="icons/icon-192.svg" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <script>
    // REGISTRA IL SERVICE WORKER SUBITO - IL PIÙ PRESTO POSSIBILE
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(e => {
        console.error('SW registration failed:', e);
      });
    }

    // Cattura beforeinstallprompt IL PIÙ PRESTO POSSIBILE
    window.__beforeInstallPromptEvent = null;
    window.__beforeInstallPromptCaught = false;

    window.addEventListener('beforeinstallprompt', (e) => {
      console.log('🎉 beforeinstallprompt CATTURATO!');
      e.preventDefault();
      window.__beforeInstallPromptEvent = e;
      window.__beforeInstallPromptCaught = true;
    }, true);  // Capture phase per assicurarsi di catturare prima di qualsiasi altro listener

    console.log('✅ SW + beforeinstallprompt listener registrati nel <head>');
  </script>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand">Conta Calorie</div>
      <div class="topbar-actions">
        <button id="installAppBtn" class="install-topbar-btn" aria-label="Aggiungi alla schermata home" title="Aggiungi alla schermata home">
          📲
        </button>
        <button id="themeToggle" class="icon-button" aria-label="Cambia tema">☀️</button>
      </div>
    </header>

    <main id="mainContent" class="page-content"></main>

    <nav id="bottomNav" class="bottom-nav" aria-label="Navigazione principale">
      <button id="navDashboard" class="nav-button active" data-view="dashboard">Dashboard</button>
      <button id="navWeek" class="nav-button" data-view="week">Settimana</button>
      <button id="navSearch" class="nav-button" data-view="search">Aggiungi</button>
      <button id="navFoods" class="nav-button" data-view="foods">Personali</button>
    </nav>
  </div>

  <template id="modalTemplate">
    <div class="modal-backdrop" role="dialog" aria-modal="true">
      <div class="modal-card">
        <button class="modal-close" aria-label="Chiudi">×</button>
        <div class="modal-body"></div>
      </div>
    </div>
  </template>

  <script type="module" src="js/app.js?v=3"></script>
</body>
</html>
